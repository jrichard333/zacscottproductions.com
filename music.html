<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Music from Zac Scott Productions with embedded Bandcamp tracks from the album One Step Ahead Of Myself."
    />
    <title>Music | Zac Scott Productions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="page-shell inner-page">
      <nav class="topbar">
        <a class="brand" href="index.html">Zac Scott Productions</a>
        <div class="nav-links">
          <a href="movies/index.html">Movies</a>
          <a class="active" href="music.html">Music</a>
          <a href="contact.html">Contact</a>
        </div>
      </nav>

      <header class="section-hero">
        <p class="eyebrow">Music</p>
      </header>

      <main>
        <div class="tab-shell">
          <input type="radio" name="music-tab" id="tab-album" checked hidden>
          <input type="radio" name="music-tab" id="tab-live" hidden>

          <div class="tab-controls">
            <label class="tab-button" for="tab-album">One Step Ahead Of Myself</label>
            <label class="tab-button" for="tab-live">Live Sessions</label>
          </div>

          <div class="tab-panels">
            <div class="tab-panel panel-album">
              <div class="thumb-grid page-grid">
                <article class="panel">
                  <p class="panel-kicker">1. Too Late</p>
                  <div class="bandcamp-player-frame">
                    <iframe
                      class="bandcamp-player"
                      src="https://bandcamp.com/EmbeddedPlayer/v=2/track=895848106/size=large/tracklist=false/artwork=small/transparent=true/"
                      seamless
                      title="Too Late"
                    ></iframe>
                  </div>
                </article>

                <article class="panel">
                  <p class="panel-kicker">2. Queen Of Ice</p>
                  <div class="bandcamp-player-frame">
                    <iframe
                      class="bandcamp-player"
                      src="https://bandcamp.com/EmbeddedPlayer/v=2/track=318295443/size=large/tracklist=false/artwork=small/transparent=true/"
                      seamless
                      title="Queen Of Ice"
                    ></iframe>
                  </div>
                </article>

                <article class="panel">
                  <p class="panel-kicker">3. If I Knew My Way</p>
                  <div class="bandcamp-player-frame">
                    <iframe
                      class="bandcamp-player"
                      src="https://bandcamp.com/EmbeddedPlayer/v=2/track=649776441/size=large/tracklist=false/artwork=small/transparent=true/"
                      seamless
                      title="If I Knew My Way"
                    ></iframe>
                  </div>
                </article>

                <article class="panel">
                  <p class="panel-kicker">4. How Long</p>
                  <div class="bandcamp-player-frame">
                    <iframe
                      class="bandcamp-player"
                      src="https://bandcamp.com/EmbeddedPlayer/v=2/track=3634475585/size=large/tracklist=false/artwork=small/transparent=true/"
                      seamless
                      title="How Long"
                    ></iframe>
                  </div>
                </article>

                <article class="panel">
                  <p class="panel-kicker">5. Older</p>
                  <div class="bandcamp-player-frame">
                    <iframe
                      class="bandcamp-player"
                      src="https://bandcamp.com/EmbeddedPlayer/v=2/track=3079816215/size=large/tracklist=false/artwork=small/transparent=true/"
                      seamless
                      title="Older"
                    ></iframe>
                  </div>
                </article>

                <article class="panel">
                  <p class="panel-kicker">6. Baby I'm Coming Home</p>
                  <div class="bandcamp-player-frame">
                    <iframe
                      class="bandcamp-player"
                      src="https://bandcamp.com/EmbeddedPlayer/v=2/track=1233411376/size=large/tracklist=false/artwork=small/transparent=true/"
                      seamless
                      title="Baby I'm Coming Home"
                    ></iframe>
                  </div>
                </article>
              </div>
            </div>

            <div class="tab-panel panel-live">
              <div class="thumb-grid page-grid">
                <article class="panel">
                  <p class="panel-kicker">After Midnight</p>
                  <div class="video-frame">
                    <iframe
                      width="100%"
                      height="450"
                      src="https://www.youtube.com/embed/HqvFFb4FV9I"
                      title="After Midnight"
                      frameborder="0"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                      allowfullscreen
                    ></iframe>
                  </div>
                </article>
                <article class="panel">
                  <p class="panel-kicker">Baby Coming Home</p>
                  <div class="video-frame">
                    <iframe
                      width="100%"
                      height="450"
                      src="https://www.youtube.com/embed/KeVmdQCQFgg"
                      title="Baby Coming Home"
                      frameborder="0"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                      allowfullscreen
                    ></iframe>
                  </div>
                </article>
                <article class="panel">
                  <p class="panel-kicker">come as you are</p>
                  <div class="video-frame">
                    <iframe
                      width="100%"
                      height="450"
                      src="https://www.youtube.com/embed/ZaPvnr20NPE"
                      title="come as you are"
                      frameborder="0"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                      allowfullscreen
                    ></iframe>
                  </div>
                </article>
                <article class="panel">
                  <p class="panel-kicker">Two times</p>
                  <div class="video-frame">
                    <iframe
                      width="100%"
                      height="450"
                      src="https://www.youtube.com/embed/bJMw60ZJMBM"
                      title="Two times"
                      frameborder="0"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                      allowfullscreen
                    ></iframe>
                  </div>
                </article>
                <article class="panel">
                  <p class="panel-kicker">Come Together</p>
                  <div class="video-frame">
                    <iframe
                      width="100%"
                      height="450"
                      src="https://www.youtube.com/embed/sIqhYFQzXkw"
                      title="Come Together"
                      frameborder="0"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                      allowfullscreen
                    ></iframe>
                  </div>
                </article>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
