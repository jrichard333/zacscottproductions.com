<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Embed debug</title>
  <style>
    body{background:#0a0d12;color:#fff;font-family:sans-serif;padding:2rem}
    .debug-wrap{max-width:900px;margin:0 auto}
    .video-frame{width:100%;position:relative;padding-top:56.25%;border:6px solid lime;border-radius:12px;overflow:hidden;background:#000}
    .video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    p{margin-top:1rem}
  </style>
</head>
<body>
  <div class="debug-wrap">
    <h1>Embed debug</h1>
    <div class="video-frame">
      <iframe
        src="https://www.youtube.com/embed/g1C9v5czht8?playsinline=1"
        title="Debug video"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>
    <p>If you can see the green-bordered player on your iPhone, the embed itself works. If not, please tell me the iPhone model and iOS version and whether you're using Safari or an in-app browser.</p>
  </div>
</body>
</html>
