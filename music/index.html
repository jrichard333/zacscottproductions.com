<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Music from Zac Scott Productions including singles, albums, scores, and live sessions."
    />
    <title>Music | Zac Scott Productions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/styles.css" />
    <style>
      /* Remove global dotted background overlay only on the Music page */
      body::before { display: none !important; }
    </style>
  </head>
  <body>
    <div class="page-shell inner-page">
      <nav class="topbar">
        <a class="brand" href="../index.html">Zac Scott Productions</a>
        <div class="nav-links">
          <a class="active" href="index.html">Music</a>
          <a href="../movies/index.html">Movies</a>
        </div>
      </nav>

      <header class="section-hero">
        <p class="eyebrow">Music</p>
        <h1>Music</h1>
      </header>

      <main class="catalog">
        <article class="catalog-card">
          <p class="card-label">Featured Album</p>
          <h2>One Step Ahead Of Myself</h2>
          
          <div class="embed-placeholder">
            <iframe
              style="border: 0; width: 100%; height: 472px;"
              src="https://bandcamp.com/EmbeddedPlayer/v=2/album=3941195449/size=large/tracklist=false/artwork=small/"
              seamless
              title="One Step Ahead Of Myself by Zac Scott on Bandcamp"
            >
              <a href="https://zacscott1.bandcamp.com/album/one-step-ahead-of-myself">
                One Step Ahead Of Myself by Zac Scott
              </a>
            </iframe>
          </div>
        </article>

        

        <article class="catalog-card">
          <p class="card-label">Live Session</p>
          <div class="embed-placeholder video">
            <iframe
              width="100%"
              height="250"
              src="https://www.youtube.com/embed/HqvFFb4FV9I"
              title="Zacattack Music Live Session 1"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
            <iframe
              width="100%"
              height="250"
              src="https://www.youtube.com/embed/KeVmdQCQFgg"
              title="Zacattack Music Live Session 2"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
            <iframe
              width="100%"
              height="250"
              src="https://www.youtube.com/embed/ZaPvnr20NPE"
              title="Zacattack Music Live Session 3"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>
          <div class="chip-row">
            <span class="chip">Live</span>
            <span class="chip">Session</span>
            <span class="chip">Video</span>
          </div>
        </article>
      </main>
    </div>
  </body>
</html>
