<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Embed simple</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #111;
      background: #f8f8f8;
      padding: 1rem;
    }

    h1 {
      font-size: 1.75rem;
      margin: 0 0 1rem;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin-bottom: 1rem;
      padding-top: 56.25%;
      background: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    p {
      margin: 0;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Simple Embed Test</h1>
  <div class="video-wrapper">
    <iframe
      src="https://www.youtube.com/embed/g1C9v5czht8?playsinline=1&rel=0&modestbranding=1"
      title="Simple video"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
    ></iframe>
  </div>
  <p>If this iframe doesn't appear on your iPhone, tell me the browser and iOS version.</p>
</body>
</html>
