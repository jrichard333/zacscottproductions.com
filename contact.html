<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Zac Scott Productions." />
    <title>Contact | Zac Scott Productions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="page-shell inner-page">
      <nav class="topbar">
        <a class="brand" href="index.html">Zac Scott Productions</a>
        <div class="nav-links">
          <a href="music/index.html">Music</a>
          <a href="movies/index.html">Movies</a>
          <a class="active" href="contact.html">Contact</a>
        </div>
      </nav>

      <main class="content-panel">
        <header class="section-hero">
          <p class="eyebrow">Contact</p>
          <h1>Get in touch</h1>
        </header>

        <section class="contact-form">
          <form id="contactForm">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />

            <label for="email">Your email</label>
            <input type="email" id="email" name="email" required />

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required />

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="8" required></textarea>

            <button class="button button-primary" type="submit">Send Message</button>
          </form>
        </section>
      </main>
    </div>

    <script>
      document.getElementById('contactForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var to = 'zscott1212@gmail.com';
        var name = document.getElementById('name').value.trim();
        var email = document.getElementById('email').value.trim();
        var subject = document.getElementById('subject').value.trim();
        var message = document.getElementById('message').value.trim();

        var mailSubject = encodeURIComponent(subject);
        var mailBody = encodeURIComponent('Name: ' + name + '\nEmail: ' + email + '\n\n' + message);

        window.location.href = 'mailto:' + to + '?subject=' + mailSubject + '&body=' + mailBody;
      });
    </script>
  </body>
</html>
