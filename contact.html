<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Zac Scott Productions." />
    <title>Contact | Zac Scott Productions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div class="page-shell inner-page">
      <nav class="topbar">
        <a class="brand" href="index.html">Zac Scott Productions</a>
        <div class="nav-links">
          <a href="music/index.html">Music</a>
          <a href="movies/index.html">Movies</a>
          <a class="active" href="contact.html">Contact</a>
        </div>
      </nav>

      <main class="content-panel">
        <header class="section-hero">
          <p class="eyebrow">Contact</p>
          <h1>Get in touch</h1>
        </header>

        <section class="contact-form">
          <form id="contactForm">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />

            <!-- Email input removed per request -->

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required />

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="8" required></textarea>

            <button class="button button-primary" type="submit">Send Message</button>
          </form>
        </section>
      </main>
    </div>

    <script>
      // Client-side POST to Formspree. Replace YOUR_FORM_ID with your Formspree form ID
      // and configure the destination email on Formspree to zscott1212@gmail.com.
      document.getElementById('contactForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        var form = e.target;
        var formData = new FormData(form);
        var endpoint = 'https://formspree.io/f/YOUR_FORM_ID'; // <-- replace this

        try {
          var res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Accept': 'application/json' },
            body: formData,
          });

          if (res.ok) {
            alert('Message sent — thank you!');
            form.reset();
          } else {
            var data = await res.json();
            alert('Error sending message: ' + (data.error || 'Unknown error'));
          }
        } catch (err) {
          alert('Error sending message. Please try again later.');
        }
      });
    </script>
  </body>
</html>
